name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            backend/backend.csproj
            backend.Tests/backend.Tests.csproj
            Tuki.Admin/Tuki.Admin.csproj

      - name: Restore backend
        run: dotnet restore backend/backend.csproj

      - name: Restore admin
        run: dotnet restore Tuki.Admin/Tuki.Admin.csproj

      - name: Restore tests
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build backend
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

      - name: Build admin
        run: dotnet build Tuki.Admin/Tuki.Admin.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend.Tests/backend.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create placeholder runtime files
        run: |
          mkdir -p runtime
          touch runtime/backend.env
          touch runtime/admin.env
          touch runtime/sqlserver.env
          touch runtime/caddy.env
          cat > runtime/compose.env <<'EOF'
          TUKI_IMAGE_TAG=ci
          TUKI_DATA_ROOT=/tmp/tuki-data
          VALHALLA_TILE_URLS=https://download.geofabrik.de/asia/philippines-latest.osm.pbf
          PELIAS_ES_JAVA_OPTS=-Xms1g -Xmx1g
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file runtime/compose.env config --quiet



  database:
    name: Database schema and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SQL_CONTAINER: tuki-ci-sql
      SQL_DATABASE: TukiCi

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate disposable SQL password
        shell: bash
        run: |
          set -euo pipefail
          password="TukiCi-$(openssl rand -hex 18)-Aa1!"
          echo "::add-mask::$password"
          echo "MSSQL_SA_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start disposable SQL Server
        run: docker run -d --name "$SQL_CONTAINER" -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD="$MSSQL_SA_PASSWORD" -p 1433:1433 -v "$GITHUB_WORKSPACE/database:/work/database:ro" mcr.microsoft.com/mssql/server:2022-latest

      - name: Wait for SQL Server
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            SQLCMD="$(docker exec "$SQL_CONTAINER" sh -c '
              if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
                printf %s /opt/mssql-tools18/bin/sqlcmd
              elif [ -x /opt/mssql-tools/bin/sqlcmd ]; then
                printf %s /opt/mssql-tools/bin/sqlcmd
              fi
            ')"

            if [ -n "$SQLCMD" ] && docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready."
              echo "SQLCMD=$SQLCMD" >> "$GITHUB_ENV"
              exit 0
            fi

            sleep 2
          done

          echo "SQL Server did not become ready in time." >&2
          docker logs "$SQL_CONTAINER" >&2
          exit 1

      - name: Create disposable database
        run: docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -C -b -Q "CREATE DATABASE [$SQL_DATABASE];"

      - name: Apply schema and migrations from scratch
        run: |
          set -euo pipefail

          run_sql_file() {
            local path="$1"
            echo "Applying $path"
            docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -C -b -d "$SQL_DATABASE" -i "/work/$path"
          }

          run_sql_file database/TukiDbSchema.sql
          run_sql_file database/TukiNavigationSchema.sql

          while IFS= read -r migration; do
            run_sql_file "$migration"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Reapply schema to verify idempotence
        run: |
          set -euo pipefail

          run_sql_file() {
            local path="$1"
            echo "Reapplying $path"
            docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -C -b -d "$SQL_DATABASE" -i "/work/$path"
          }

          run_sql_file database/TukiDbSchema.sql
          run_sql_file database/TukiNavigationSchema.sql

          while IFS= read -r migration; do
            run_sql_file "$migration"
          done < <(find database/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

      - name: Run database health and behavior smoke tests
        run: docker exec -e SQLCMDPASSWORD="$MSSQL_SA_PASSWORD" "$SQL_CONTAINER" "$SQLCMD" -S localhost -U sa -C -b -d "$SQL_DATABASE" -i /work/database/ci/SmokeTests.sql

      - name: Set up .NET 9 for database integration tests
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            backend/backend.csproj
            backend.Tests/backend.Tests.csproj

      - name: Restore database integration test project
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Run TukiDbContext SQL Server integration tests
        env:
          TUKI_REQUIRE_SQLSERVER_INTEGRATION: "true"
          TUKI_SQLSERVER_INTEGRATION_CONNECTION: "Server=localhost,1433;Database=TukiCi;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: dotnet test backend.Tests/backend.Tests.csproj --configuration Release --no-restore --filter "Category=SqlServerIntegration" --logger "trx;LogFileName=sqlserver-integration-tests.trx"

      - name: Upload database integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-integration-test-results
          path: backend.Tests/TestResults/**/sqlserver-integration-tests.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Show SQL Server logs on failure
        if: failure()
        run: docker logs "$SQL_CONTAINER"

      - name: Remove disposable SQL Server
        if: always()
        run: docker rm -f "$SQL_CONTAINER" >/dev/null 2>&1 || true
