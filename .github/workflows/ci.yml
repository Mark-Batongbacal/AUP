name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
  push:
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate promotion source
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$PR_BASE_REF" = "staging" ]; then
            if [ "$PR_HEAD_REF" != "dev" ] || [ "$PR_HEAD_REPO" != "$CURRENT_REPO" ]; then
              echo "::error::Only the dev branch from $CURRENT_REPO may be merged into staging."
              exit 1
            fi
          fi

          if [ "$PR_BASE_REF" = "main" ]; then
            if [ "$PR_HEAD_REF" != "staging" ] || [ "$PR_HEAD_REPO" != "$CURRENT_REPO" ]; then
              echo "::error::Only the staging branch from $CURRENT_REPO may be merged into main."
              exit 1
            fi
          fi

          echo "Promotion source is valid: $PR_HEAD_REF -> $PR_BASE_REF"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: |
            backend/backend.csproj
            backend.Tests/backend.Tests.csproj
            Tuki.Admin/Tuki.Admin.csproj

      - name: Restore backend
        run: dotnet restore backend/backend.csproj

      - name: Restore admin
        run: dotnet restore Tuki.Admin/Tuki.Admin.csproj

      - name: Restore tests
        run: dotnet restore backend.Tests/backend.Tests.csproj

      - name: Build backend
        run: dotnet build backend/backend.csproj --configuration Release --no-restore

      - name: Build admin
        run: dotnet build Tuki.Admin/Tuki.Admin.csproj --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test backend.Tests/backend.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend.Tests/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create placeholder runtime files
        run: |
          mkdir -p runtime
          touch runtime/backend.env
          touch runtime/admin.env
          touch runtime/sqlserver.env
          touch runtime/caddy.env
          cat > runtime/compose.env <<'EOF'
          TUKI_IMAGE_TAG=ci
          TUKI_DATA_ROOT=/tmp/tuki-data
          VALHALLA_TILE_URLS=https://download.geofabrik.de/asia/philippines-latest.osm.pbf
          PELIAS_ES_JAVA_OPTS=-Xms1g -Xmx1g
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file runtime/compose.env config --quiet
