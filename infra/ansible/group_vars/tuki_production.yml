---
# Azure legacy compatibility defaults for the current production host. Compose
# discovery always runs first. At GCP cutover, the protected GitHub environment
# supplies PRODUCTION_COMPOSE_ROOT=/opt/tuki/AUP; successful Compose discovery
# means these legacy fallback names are never consulted.
tuki_production_compose_root: /home/AUP/AUP
tuki_sql_container_fallback: tuki-sql
tuki_pelias_container_fallback: pelias_api
tuki_valhalla_container_fallback: valhalla
