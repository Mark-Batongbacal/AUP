name: Navigation Trip Options Verify

on:
  push:
    branches:
      - navigation_reroute_geometry_arrival
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test backend.Tests/backend.Tests.csproj --configuration Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Android
        working-directory: frontend
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI-only iOS configuration
        working-directory: frontend/ios/TUKI
        run: |
          cat > Secrets.generated.xcconfig <<'EOF'
          GOOGLE_CLIENT_ID = ci-placeholder.apps.googleusercontent.com
          GOOGLE_SERVER_CLIENT_ID = ci-placeholder.apps.googleusercontent.com
          FACEBOOK_APP_ID = 000000000000000
          FACEBOOK_CLIENT_TOKEN = ci-placeholder
          EOF
      - name: Build iOS
        run: |
          xcodebuild \
            -project frontend/ios/TUKI/TUKI.xcodeproj \
            -scheme TUKI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
