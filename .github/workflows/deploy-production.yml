name: Production CD

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact CI-tested main commit to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tuki-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CI-tested commit to production
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      inputs.commit_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production

    steps:
      - name: Check out exact production commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Verify checked-out commit
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_COMMIT" = "${{ github.sha }}"
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Install Ansible
        run: python -m pip install 'ansible-core~=2.18.0'

      - name: Configure strict production SSH access
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_SSH_PRIVATE_KEY_B64: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY_B64 }}
          PRODUCTION_SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          PRODUCTION_COMPOSE_ROOT: ${{ vars.PRODUCTION_COMPOSE_ROOT }}
          PRODUCTION_PUBLIC_HEALTH_MODE: ${{ vars.PRODUCTION_PUBLIC_HEALTH_MODE }}
          PRODUCTION_EXPECTED_ORIGIN_ADDRESS: ${{ vars.PRODUCTION_EXPECTED_ORIGIN_ADDRESS }}
        run: |
          set -euo pipefail

          for name in PRODUCTION_HOST PRODUCTION_SSH_USER PRODUCTION_SSH_PRIVATE_KEY_B64 PRODUCTION_SSH_HOST_KEY ANSIBLE_VAULT_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name GitHub production environment secret."
              exit 1
            fi
          done
          echo "✓ all production environment secrets are present"

          if [[ ! "$PRODUCTION_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::PRODUCTION_HOST must be an IPv4 address or DNS hostname."
            exit 1
          fi
          if [[ ! "$PRODUCTION_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]; then
            echo "::error::PRODUCTION_SSH_USER is not a valid account name."
            exit 1
          fi

          health_mode="${PRODUCTION_PUBLIC_HEALTH_MODE:-origin}"
          if [[ "$health_mode" != dns && "$health_mode" != origin ]]; then
            echo "::error::PRODUCTION_PUBLIC_HEALTH_MODE must be dns or origin."
            exit 1
          fi
          if [[ -n "$PRODUCTION_EXPECTED_ORIGIN_ADDRESS" && ! "$PRODUCTION_EXPECTED_ORIGIN_ADDRESS" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::PRODUCTION_EXPECTED_ORIGIN_ADDRESS must be an IPv4 address when set."
            exit 1
          fi
          if [[ -n "$PRODUCTION_COMPOSE_ROOT" && ! "$PRODUCTION_COMPOSE_ROOT" =~ ^/[-A-Za-z0-9_./]+$ ]]; then
            echo "::error::PRODUCTION_COMPOSE_ROOT must be an absolute path."
            exit 1
          fi

          # In origin mode the playbook validates Caddy locally through 127.0.0.1
          # with the real production hostname/SNI. The GitHub runner performs the
          # external-origin and public-DNS checks after Ansible completes, avoiding
          # any dependency on cloud-provider hairpin NAT.
          playbook_connection_host="$PRODUCTION_HOST"
          if [[ "$health_mode" == origin ]]; then
            playbook_connection_host="127.0.0.1"
          fi

          install -d -m 700 "$HOME/.ssh"

          if ! printf '%s' "$PRODUCTION_SSH_PRIVATE_KEY_B64" | base64 --decode > "$RUNNER_TEMP/production-key"; then
            echo "::error::PRODUCTION_SSH_PRIVATE_KEY_B64 is not valid base64."
            exit 1
          fi
          echo "✓ production SSH private key decoded"

          chmod 600 "$RUNNER_TEMP/production-key"
          if ! ssh-keygen -y -f "$RUNNER_TEMP/production-key" >/dev/null; then
            echo "::error::Decoded production SSH private key is not a valid SSH private key."
            exit 1
          fi
          echo "✓ production SSH private key is valid"

          printf '%s\n' "$PRODUCTION_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          echo "✓ production SSH known_hosts file written"

          if ! ssh-keygen -F "$PRODUCTION_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null; then
            echo "::error::PRODUCTION_SSH_HOST_KEY does not contain an entry matching PRODUCTION_HOST. Regenerate it with ssh-keyscan using the exact PRODUCTION_HOST value."
            exit 1
          fi
          echo "✓ production host key matches PRODUCTION_HOST"

          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$RUNNER_TEMP/vault-password"
          chmod 600 "$RUNNER_TEMP/vault-password"
          echo "✓ Ansible vault password file prepared"

          {
            printf '[tuki_production]\n'
            printf 'production ansible_host=%s ansible_user=%s ansible_ssh_private_key_file=%s tuki_production_connection_host=%s tuki_production_public_health_mode=%s' \
              "$PRODUCTION_HOST" "$PRODUCTION_SSH_USER" "$RUNNER_TEMP/production-key" "$playbook_connection_host" "$health_mode"
            if [[ -n "$PRODUCTION_COMPOSE_ROOT" ]]; then
              printf ' tuki_production_compose_root=%s' "$PRODUCTION_COMPOSE_ROOT"
            fi
            printf " ansible_ssh_common_args='-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%s/.ssh/known_hosts'\n" "$HOME"
          } > infra/ansible/inventory.cd.ini
          echo "✓ production Ansible inventory prepared"

      - name: Verify production SSH authentication
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/production-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
            true

      - name: Capture previous production deployment marker
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/production-key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
            'sudo -n sh -c '\''test -f /opt/tuki/production/deployed-commit && cat /opt/tuki/production/deployed-commit || true'\''' \
            > "$RUNNER_TEMP/previous-production-commit"

      - name: Deploy exact main commit to production
        env:
          PRODUCTION_COMMIT: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          ansible-playbook \
            -i infra/ansible/inventory.cd.ini \
            infra/ansible/playbooks/deploy-production.yml \
            --limit production \
            --vault-password-file "$RUNNER_TEMP/vault-password" \
            -e "tuki_production_git_revision=$PRODUCTION_COMMIT" \
            -e "tuki_production_image_tag=$PRODUCTION_COMMIT"

      - name: Verify production externally from GitHub runner
        env:
          PRODUCTION_COMMIT: ${{ inputs.commit_sha }}
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          PRODUCTION_PUBLIC_HEALTH_MODE: ${{ vars.PRODUCTION_PUBLIC_HEALTH_MODE }}
          PRODUCTION_EXPECTED_ORIGIN_ADDRESS: ${{ vars.PRODUCTION_EXPECTED_ORIGIN_ADDRESS }}
          API_HOSTNAME: api.tuki.pawfect.bar
          ADMIN_HOSTNAME: admin.tuki.pawfect.bar
        run: |
          set -euo pipefail

          restore_previous_marker() {
            local previous
            previous="$(tr -d '[:space:]' < "$RUNNER_TEMP/previous-production-commit")"
            if [[ "$previous" =~ ^[0-9a-f]{40}$ ]]; then
              ssh \
                -i "$RUNNER_TEMP/production-key" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
                "printf '%s\\n' '$previous' | sudo -n tee /opt/tuki/production/deployed-commit >/dev/null"
            else
              ssh \
                -i "$RUNNER_TEMP/production-key" \
                -o BatchMode=yes \
                -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes \
                -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
                "$PRODUCTION_SSH_USER@$PRODUCTION_HOST" \
                'sudo -n rm -f /opt/tuki/production/deployed-commit'
            fi
          }

          on_exit() {
            local rc=$?
            if ((rc != 0)); then
              echo "External verification failed; restoring the previous deployment marker." >&2
              restore_previous_marker || echo "::warning::Failed to restore previous deployment marker."
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          health_mode="${PRODUCTION_PUBLIC_HEALTH_MODE:-origin}"

          resolve_ipv4() {
            local target="$1"
            if [[ "$target" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
              printf '%s\n' "$target"
            else
              getent ahostsv4 "$target" | awk '$2 == "STREAM" { print $1 }' | sort -u
            fi
          }

          assert_deployment_header() {
            local headers="$1"
            local actual
            actual="$(awk -F': *' 'tolower($1) == "x-tuki-deployment" { gsub("\\r", "", $2); print $2 }' "$headers" | tail -n 1)"
            if [[ "$actual" != "$PRODUCTION_COMMIT" ]]; then
              echo "::error::Expected X-Tuki-Deployment=$PRODUCTION_COMMIT but received '${actual:-<missing>}'."
              exit 1
            fi
          }

          mapfile -t production_addresses < <(resolve_ipv4 "$PRODUCTION_HOST")
          if ((${#production_addresses[@]} == 0)); then
            echo "::error::Could not resolve PRODUCTION_HOST to an IPv4 address."
            exit 1
          fi

          if [[ "$health_mode" == origin ]]; then
            origin="$PRODUCTION_EXPECTED_ORIGIN_ADDRESS"
            if [[ -z "$origin" ]]; then
              if ((${#production_addresses[@]} != 1)); then
                echo "::error::PRODUCTION_HOST resolves to multiple IPv4 addresses; set PRODUCTION_EXPECTED_ORIGIN_ADDRESS."
                exit 1
              fi
              origin="${production_addresses[0]}"
            fi

            if ! printf '%s\n' "${production_addresses[@]}" | grep -Fxq "$origin"; then
              echo "::error::PRODUCTION_EXPECTED_ORIGIN_ADDRESS does not belong to PRODUCTION_HOST."
              exit 1
            fi

            for hostname in "$API_HOSTNAME" "$ADMIN_HOSTNAME"; do
              headers="$RUNNER_TEMP/${hostname}.origin.headers"
              curl --fail --silent --show-error --location --noproxy '*' \
                --max-time 30 \
                --resolve "$hostname:443:$origin" \
                --dump-header "$headers" \
                --output /dev/null \
                "https://$hostname/health"
              assert_deployment_header "$headers"
            done
            echo "✓ external origin HTTPS health matches the deployed commit"
          fi

          # Always verify the real public route too. The deployment SHA response
          # header proves DNS/Cloudflare reached this deployment rather than a
          # still-healthy previous provider.
          for hostname in "$API_HOSTNAME" "$ADMIN_HOSTNAME"; do
            headers="$RUNNER_TEMP/${hostname}.public.headers"
            curl --fail --silent --show-error --location --noproxy '*' \
              --max-time 30 \
              --dump-header "$headers" \
              --output /dev/null \
              "https://$hostname/health"
            assert_deployment_header "$headers"
          done
          echo "✓ public HTTPS health matches the deployed commit"
