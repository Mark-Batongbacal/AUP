---
- name: Bootstrap Tuki GCP Ubuntu host
  hosts: tuki_gcp
  become: true
  vars:
    tuki_repository_url: https://github.com/Mark-Batongbacal/AUP.git
    # A migration target is prepared from production code by default. Operators
    # may override this for testing, but bootstrap never silently selects dev.
    tuki_repository_branch: main
    tuki_install_root: /opt/tuki
  vars_files:
    - "{{ playbook_dir }}/../group_vars/vault.yml"

  pre_tasks:
    - name: Validate required deployment variables
      ansible.builtin.assert:
        that:
          - tuki_api_hostname is defined
          - tuki_api_hostname | string | length > 0
          - tuki_admin_hostname is defined
          - tuki_admin_hostname | string | length > 0
          - tuki_acme_email is defined
          - tuki_acme_email | string | length > 0
          - tuki_valhalla_tile_urls is defined
          - tuki_valhalla_tile_urls | string | length > 0
          - tuki_pelias_es_java_opts is defined
          - tuki_pelias_es_java_opts | string | length > 0
          - tuki_mssql_sa_password is defined
          - tuki_mssql_sa_password | string | length > 0
          - tuki_admin_login_username is defined
          - tuki_admin_login_username | string | length > 0
          - tuki_admin_login_password is defined
          - tuki_admin_login_password | string | length > 0
          - tuki_login_users is defined
          - tuki_login_users | length > 0
          - tuki_login_users[0].username | string | length > 0
          - tuki_login_users[0].password | string | length > 0
          - tuki_gemini_api_key is defined
          - tuki_gemini_api_key | string | length > 0
          - tuki_google_places_api_key is defined
          - tuki_google_places_api_key | string | length > 0
          - tuki_google_client_id is defined
          - tuki_google_client_id | string | length > 0
          - tuki_facebook_app_id is defined
          - tuki_facebook_app_id | string | length > 0
          - tuki_facebook_app_secret is defined
          - tuki_facebook_app_secret | string | length > 0
          - tuki_email_connection_string is defined
          - tuki_email_connection_string | string | length > 0
          - tuki_email_sender_address is defined
          - tuki_email_sender_address | string | length > 0
        fail_msg: >-
          Define deployment values in group_vars/all.yml and keep secrets in an
          Ansible Vault-encrypted group_vars/vault.yml.
      no_log: true

    - name: Validate every configured application login
      ansible.builtin.assert:
        that:
          - item.username is defined
          - item.username | string | length > 0
          - item.password is defined
          - item.password | string | length > 0
      loop: "{{ tuki_login_users }}"
      no_log: true

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - debian-archive-keyring
          - debian-keyring
          - git
          - gnupg
          - rsync
          - unzip
          - btop
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Create the root configuration before installing the package so a fresh
    # host never starts Caddy's packaged example site. Production deployment
    # owns the site fragment; bootstrap owns only the import directory/root.
    - name: Create host Caddy configuration directory
      ansible.builtin.file:
        path: /etc/caddy/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create minimal host Caddy root configuration when absent
      ansible.builtin.copy:
        content: |
          # Site definitions are managed as validated fragments in conf.d.
          # BEGIN ANSIBLE MANAGED TUKI FRAGMENTS
          import /etc/caddy/conf.d/*.caddy
          # END ANSIBLE MANAGED TUKI FRAGMENTS
        dest: /etc/caddy/Caddyfile
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Ensure host Caddy root imports managed fragments
      ansible.builtin.blockinfile:
        path: /etc/caddy/Caddyfile
        marker: "# {mark} ANSIBLE MANAGED TUKI FRAGMENTS"
        block: "import /etc/caddy/conf.d/*.caddy"
        insertafter: EOF

    - name: Create APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download official Caddy repository signing key
      ansible.builtin.get_url:
        url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
        dest: /etc/apt/keyrings/caddy-stable.asc
        owner: root
        group: root
        mode: "0644"
      register: tuki_caddy_repository_key

    - name: Inspect installed Caddy binary keyring
      ansible.builtin.stat:
        path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      register: tuki_caddy_binary_keyring

    - name: Install Caddy repository binary keyring
      ansible.builtin.command:
        argv:
          - gpg
          - --dearmor
          - --yes
          - --output
          - /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          - /etc/apt/keyrings/caddy-stable.asc
      when: tuki_caddy_repository_key.changed or not tuki_caddy_binary_keyring.stat.exists
      changed_when: true

    - name: Make Caddy repository keyring readable by APT
      ansible.builtin.file:
        path: /usr/share/keyrings/caddy-stable-archive-keyring.gpg
        owner: root
        group: root
        mode: "0644"

    - name: Configure official stable Caddy APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg]
          https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
        filename: caddy-stable
        state: present
        update_cache: true

    - name: Install host Caddy
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Validate minimal host Caddy configuration
      ansible.builtin.command:
        argv: [caddy, validate, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
      changed_when: false

    - name: Enable and start host Caddy
      ansible.builtin.systemd_service:
        name: caddy
        enabled: true
        state: started

    - name: Install Docker repository signing key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure Docker Engine APT repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present
        update_cache: true

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present

    - name: Enable and start Docker Engine
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Keep host SSH enabled on port 22
      ansible.builtin.service:
        name: ssh
        state: started
        enabled: true

    - name: Add SSH user to Docker group
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Configure virtual memory for Pelias Elasticsearch
      ansible.builtin.copy:
        content: "vm.max_map_count=262144\n"
        dest: /etc/sysctl.d/99-tuki-elasticsearch.conf
        owner: root
        group: root
        mode: "0644"
      register: tuki_sysctl

    - name: Apply virtual memory configuration
      ansible.builtin.command: sysctl --system
      when: tuki_sysctl.changed
      changed_when: true

    - name: Create Tuki installation directory
      ansible.builtin.file:
        path: "{{ tuki_install_root }}"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Create persistent service directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ tuki_install_root }}/data/sqlserver", owner: "10001", group: "0", mode: "0770" }
        - { path: "{{ tuki_install_root }}/data/valhalla", owner: "1000", group: "1000", mode: "0775" }
        - { path: "{{ tuki_install_root }}/data/pelias", owner: "1000", group: "1000", mode: "0775" }
        - { path: "{{ tuki_install_root }}/data/pelias/elasticsearch", owner: "1000", group: "1000", mode: "0775" }
        - { path: "{{ tuki_install_root }}/backups/incoming", owner: "root", group: "root", mode: "0700" }
        - { path: "{{ tuki_install_root }}/backups/automated", owner: "root", group: "root", mode: "0700" }

    - name: Clone or update the configured repository branch
      ansible.builtin.git:
        repo: "{{ tuki_repository_url }}"
        dest: "{{ tuki_install_root }}/AUP"
        version: "{{ tuki_repository_branch }}"
        refspec: "+refs/heads/{{ tuki_repository_branch }}:refs/remotes/origin/{{ tuki_repository_branch }}"
        single_branch: true
        update: true
        force: false
      become: false

    - name: Create private runtime configuration directory
      ansible.builtin.file:
        path: "{{ tuki_install_root }}/AUP/runtime"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0700"

    - name: Render service-specific runtime environment files
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/{{ item.template }}"
        dest: "{{ tuki_install_root }}/AUP/runtime/{{ item.destination }}"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"
      loop:
        - { template: backend.env.j2, destination: backend.env }
        - { template: sqlserver.env.j2, destination: sqlserver.env }
        - { template: admin.env.j2, destination: admin.env }
        - { template: caddy.env.j2, destination: caddy.env }
      no_log: true

    - name: Render Docker Compose interpolation variables
      ansible.builtin.copy:
        content: |
          # The broad Compose project is never the production application.
          TUKI_IMAGE_TAG={{ tuki_bootstrap_nonproduction_image_tag | default('bootstrap-only') }}
          TUKI_DATA_ROOT={{ tuki_install_root }}/data
          VALHALLA_TILE_URLS={{ tuki_valhalla_tile_urls }}
          PELIAS_ES_JAVA_OPTS="{{ tuki_pelias_es_java_opts | replace('"', '\\"') }}"
        dest: "{{ tuki_install_root }}/AUP/runtime/compose.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: docker compose --env-file runtime/compose.env config --quiet
        chdir: "{{ tuki_install_root }}/AUP"
      changed_when: false
      no_log: true

    - name: Report bootstrap completion
      ansible.builtin.debug:
        msg: >-
          GCP host bootstrap is complete. Docker, persistent directories, repository,
          runtime configuration, host Caddy, backup directories, and Compose validation
          are ready. No application or data-service containers were started; prepare
          and migrate data before the normal production deployment.
