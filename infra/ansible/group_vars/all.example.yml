---
# Copy non-secret settings into group_vars/all.yml. Production secrets belong
# only in the encrypted group_vars/vault.yml file; see ../README.md.
tuki_api_hostname: api.example.com
tuki_admin_hostname: admin.example.com
tuki_staging_api_hostname: staging-api.example.com
tuki_staging_admin_hostname: staging-admin.example.com
tuki_acme_email: ops@example.com
tuki_database_name: Tuki
tuki_staging_database_name: Tuki_Staging
tuki_mssql_pid: Developer
tuki_image_tag: dev
tuki_staging_image_tag: staging
tuki_staging_install_root: /opt/tuki/staging
tuki_staging_network: tuki-staging-internal
tuki_staging_backend_host_port: 5130
tuki_staging_admin_host_port: 5031
tuki_repository_url: https://github.com/example/AUP.git
tuki_valhalla_tile_urls: https://download.geofabrik.de/asia/philippines-latest.osm.pbf
tuki_pelias_es_java_opts: "-Xms1g -Xmx1g"

# Pelias snapshot index and shared-data migration. Adjust the Azure source path
# locally when its legacy project checkout differs.
tuki_pelias_index_name: pelias
tuki_pelias_verify_query: SM City Telabastagan
tuki_azure_pelias_project_root: /path/to/azure/pelias-project
tuki_gcp_pelias_root: /opt/tuki/data/pelias
tuki_pelias_es_compose_service: pelias-elasticsearch
tuki_pelias_es_container_fallback: ""

# SQL backup/restore migration paths and Compose service discovery.
tuki_sql_compose_service: sqlserver
tuki_sql_backup_filename: "{{ tuki_database_name }}.bak"
tuki_sql_container_backup_dir: /var/opt/mssql/backup
tuki_azure_compose_root: /path/to/azure/AUP
tuki_azure_backup_dir: /opt/tuki/backups
tuki_gcp_compose_root: /opt/tuki/AUP
tuki_gcp_backup_incoming_dir: /opt/tuki/backups/incoming
tuki_compose_env: runtime/compose.env

# Optional explicit fallback for a legacy SQL container not managed by the
# repository Compose project. Prefer leaving this empty and using Compose.
tuki_sql_container_fallback: ""

# Existing data-service discovery for the isolated staging application project.
tuki_pelias_compose_service: pelias
tuki_pelias_container_fallback: ""
tuki_valhalla_compose_service: valhalla
tuki_valhalla_container_fallback: ""
tuki_caddyfile_path: /etc/caddy/Caddyfile

# Automated SQL Server backups to Google Drive. The rclone configuration itself
# belongs in encrypted group_vars/vault.yml as tuki_rclone_config.
tuki_rclone_remote: gdrive
tuki_backup_remote_root: Tuki/production/database
tuki_backup_local_dir: /opt/tuki/backups/automated
tuki_backup_daily_retention: 7
tuki_backup_weekly_retention: 4
tuki_backup_monthly_retention: 3

# Timers use Asia/Manila explicitly so VM timezone does not change the schedule.
# Defaults: daily 02:00, Sunday 03:00, first day of the month 04:00.
tuki_backup_daily_calendar: "*-*-* 02:00:00 Asia/Manila"
tuki_backup_weekly_calendar: "Sun *-*-* 03:00:00 Asia/Manila"
tuki_backup_monthly_calendar: "*-*-01 04:00:00 Asia/Manila"
tuki_backup_randomized_delay: 5m
