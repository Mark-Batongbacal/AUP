---
- name: Verify Tuki deployment on GCP
  hosts: tuki_gcp
  become: true
  vars:
    tuki_install_root: /opt/tuki
    tuki_compose_env: runtime/compose.env
    tuki_services:
      - sqlserver
      - pelias-elasticsearch
      - pelias
      - valhalla
      - backend
      - admin
      - caddy

  tasks:
    - name: Validate Docker Compose configuration
      ansible.builtin.command:
        cmd: "docker compose --env-file {{ tuki_compose_env }} config --quiet"
        chdir: "{{ tuki_install_root }}/AUP"
      changed_when: false

    - name: Verify every container is healthy
      ansible.builtin.shell:
        cmd: |
          set -eu
          container_id="$(docker compose --env-file {{ tuki_compose_env }} ps -q {{ item }})"
          test -n "$container_id"
          status="$(docker inspect --format '{% raw %}{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}{% endraw %}' "$container_id")"
          printf '%s' "$status"
          test "$status" = "healthy"
        chdir: "{{ tuki_install_root }}/AUP"
        executable: /bin/bash
      loop: "{{ tuki_services }}"
      register: tuki_service_health
      changed_when: false

    - name: Verify API HTTPS endpoint and certificate
      ansible.builtin.command:
        cmd: >-
          curl --silent --show-error --location --max-time 20
          --output /dev/null --write-out %{http_code}
          https://{{ tuki_api_hostname }}/
      register: tuki_api_http
      changed_when: false

    - name: Require a non-server-error API response
      ansible.builtin.assert:
        that:
          - tuki_api_http.stdout | int >= 200
          - tuki_api_http.stdout | int < 500
        fail_msg: >-
          The public API HTTPS endpoint did not return a usable HTTP response.
          TLS validation is enabled by curl, so certificate failures also fail
          the preceding task.

    - name: Verify admin HTTPS endpoint and certificate
      ansible.builtin.command:
        cmd: >-
          curl --silent --show-error --location --max-time 20
          --output /dev/null --write-out %{http_code}
          https://{{ tuki_admin_hostname }}/
      register: tuki_admin_http
      changed_when: false

    - name: Require a non-server-error admin response
      ansible.builtin.assert:
        that:
          - tuki_admin_http.stdout | int >= 200
          - tuki_admin_http.stdout | int < 500
        fail_msg: >-
          The public admin HTTPS endpoint did not return a usable HTTP response.
          TLS validation is enabled by curl, so certificate failures also fail
          the preceding task.

    - name: Show full Compose status
      ansible.builtin.command:
        cmd: "docker compose --env-file {{ tuki_compose_env }} ps"
        chdir: "{{ tuki_install_root }}/AUP"
      register: tuki_compose_status
      changed_when: false

    - name: Report verification result
      ansible.builtin.debug:
        msg:
          - "API HTTPS status: {{ tuki_api_http.stdout }}"
          - "Admin HTTPS status: {{ tuki_admin_http.stdout }}"
          - "{{ tuki_compose_status.stdout_lines }}"
