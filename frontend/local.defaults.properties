# Non-secret fallback used only so the project can build without committing a real key.
# Developers should put their own Maps SDK for Android key in frontend/local.properties:
# MAPS_API_KEY=YOUR_API_KEY
MAPS_API_KEY=DEFAULT_API_KEY

# Developers should set these in frontend/local.properties for real auth:
# GOOGLE_SERVER_CLIENT_ID=YOUR_WEB_OR_SERVER_CLIENT_ID.apps.googleusercontent.com
# BACKEND_BASE_URL=http://10.0.2.2:5129/
GOOGLE_SERVER_CLIENT_ID=YOUR_WEB_OR_SERVER_CLIENT_ID.apps.googleusercontent.com
BACKEND_BASE_URL=http://tuki-api.japaneast.cloudapp.azure.com:5129

# Developers should set these in frontend/local.properties for Facebook Login:
# FACEBOOK_APP_ID=YOUR_FACEBOOK_APP_ID
# FACEBOOK_CLIENT_TOKEN=YOUR_FACEBOOK_CLIENT_TOKEN
FACEBOOK_APP_ID=0
FACEBOOK_CLIENT_TOKEN=DEFAULT_FACEBOOK_CLIENT_TOKEN
